name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild knowledge index
        run: |
          python tools/build_kb.py
          python tools/check_kb.py

      - name: Check the committed index is reproducible
        run: git diff --exit-code -- kb/

      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: CLI smoke test
        run: |
          ./gradlew --no-daemon :cli:run --args="brief --chat fixtures/cold-chat.txt --json" > brief.json
          python - <<'PY'
          import json
          b = json.load(open('brief.json', encoding='utf-8'))
          assert b['emotion']['feeling']
          assert b['advice']['headline']
          assert b['citations'], 'a brief must cite its sources'
          print('brief ok:', b['advice']['headline'])
          PY
